<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MySQL Profiler{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        /* Tailwind CDN + plotly need body to never be white-on-white. */
        body { background-color: #0f172a; color: #e2e8f0; }
        .tw-prose table th { color: #94a3b8; }
    </style>
</head>
<body class="min-h-screen antialiased">
<nav class="sticky top-0 z-10 bg-slate-900/95 border-b border-slate-800 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4">
        <div class="flex flex-wrap items-center gap-x-5 gap-y-2 py-3">
            <span class="font-bold text-indigo-400 text-lg">🖥 MySQL Profiler</span>
            <!-- Server clock -->
            <span id="nav-clock" class="text-xs text-slate-400 font-mono tabular-nums"></span>
            <div class="flex flex-wrap items-center gap-x-1 gap-y-1 ml-auto">
                <a href="/" class="px-3 py-1.5 rounded-md text-sm font-medium {% if request.url.path == '/' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-800{% endif %}">Dashboard</a>
                <a href="/logs" class="px-3 py-1.5 rounded-md text-sm font-medium {% if request.url.path == '/logs' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-800{% endif %}">Logs</a>
                <a href="/pm2" class="px-3 py-1.5 rounded-md text-sm font-medium {% if request.url.path == '/pm2' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-800{% endif %}">PM2</a>
                <a href="/logout" class="px-3 py-1.5 rounded-md text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-100">Logout</a>
            </div>
        </div>
    </div>
</nav>

<main class="max-w-6xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
</main>

<footer class="max-w-6xl mx-auto px-4 py-6 text-center text-xs text-slate-500">
    MySQL Performance Monitoring &amp; Query Intelligence Platform
</footer>

<script>
// Server clock — ticks every second using the browser's JS clock.
// Timezone syncs with the dashboard's tz-select if on the dashboard page;
// falls back to the browser local timezone otherwise.
(function() {
    function getClockTz() {
        const sel = document.getElementById('tz-select');
        if (sel && sel.value && sel.value !== 'local') return sel.value;
        return Intl.DateTimeFormat().resolvedOptions().timeZone;
    }
    function tick() {
        const el = document.getElementById('nav-clock');
        if (!el) return;
        const tz = getClockTz();
        const now = new Date();
        try {
            el.textContent = now.toLocaleTimeString('en-GB', {
                timeZone: tz,
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
            }) + ' ' + new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'short' })
                .formatToParts(now).find(p => p.type === 'timeZoneName').value;
        } catch (_) {
            el.textContent = now.toLocaleTimeString();
        }
    }
    tick();
    setInterval(tick, 1000);

    // Re-sync when dashboard timezone selector changes
    document.addEventListener('change', function(e) {
        if (e.target && e.target.id === 'tz-select') tick();
    });
})();
</script>
</body>
</html>
